<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Editar publicación | Stargaze</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="app-page">
    <div class="sky-glow"></div>
    <div class="orbit">
        <span>✦</span>
    </div>
    <main class="edit-container">
        <p class="eyebrow">
            STARGAZE
        </p>
        <h1>
            Editar Publicación
        </h1>
        <p class="section-intro">
            Ajusta los datos de tu observación.
        </p>
        {% with messages =
            get_flashed_messages(
                category_filter=["publication"]
            )
        %}
            {% if messages %}
                {% for message in messages %}
                    <p class="error">
                        {{ message }}
                    </p>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form
            action="/publications/update/{{ publication.id }}"
            method="POST"
        >
            <div class="form-group">
                <label>
                    Nombre
                </label>
                <input
                    type="text"
                    name="name"
                    value="{{ publication.name }}"
                >
            </div>
            <div class="form-group">
                <label>
                    Fecha
                </label>
                <input
                    type="date"
                    name="event_date"
                    value="{{ publication.event_date }}"
                >
            </div>
            <div class="form-group">
                <label>
                    Lugar
                </label>
                <input
                    type="text"
                    name="location"
                    value="{{ publication.location }}"
                >
            </div>
            <div class="form-group">
                <label>
                    Descripción
                </label>
                <textarea
                    name="description"
                >{{ publication.description }}</textarea>
            </div>
            <div class="edit-actions">
                <button type="submit">
                    Guardar cambios
                </button>
                <a
                    class="btn-secondary"
                    href="/dashboard"
                >
                    Volver
                </a>
            </div>
        </form>
    </main>
</body>

</html>
